name: Entrega 3 - Evaluador Implementación con Email (OBSOLETO)

# OBSOLETO: la prueba de envío de correos se fusionó dentro de
# "Evaluador Implementación Entrega 3" (ci_evaluador_entrega3.yml), que ahora
# lee el correo destino desde la clave EMAIL_TO_NOTIFY del secret de Secrets
# Manager "secrets-pipeline-native-map" en vez de recibirlo como parámetro
# manual. Use ci_evaluador_entrega3.yml en su lugar.
#
# Este archivo se deja a propósito (no se borra) para que cualquier
# invocación existente (manual o `uses:` desde otro repo) falle rápido con un
# mensaje claro en vez de con un error de "workflow not found".
on:
  workflow_dispatch:
    inputs:
      email:
        description: 'Email'
        required: true
      environment:
        type: choice
        required: true
        description: 'Select the target environment'
        options:
          - student1
          - student2
          - student3
          - student4
          - tutor
  workflow_call:
    inputs:
      email:
        type: string
        description: 'Email'
        required: true
      environment:
        type: string
        required: true
        description: 'Select the target environment'
    secrets:
      AWS_ACCESS_KEY_ID:
        required: true
      AWS_SECRET_ACCESS_KEY:
        required: true
      AWS_SESSION_TOKEN:
        required: true
jobs:
  obsolete:
    environment: ${{ inputs.environment }}
    runs-on: ubuntu-latest
    steps:
      - name: Este pipeline está obsoleto
        run: |
          echo "❌ Este pipeline (ci_evaluador_entrega3_email.yml) está OBSOLETO y ya no se usa para calificar."
          echo "La prueba de envío de correos ahora es parte de 'Evaluador Implementación Entrega 3' (ci_evaluador_entrega3.yml)."
          echo "Ese pipeline lee el correo destino automáticamente desde el secret EMAIL_TO_NOTIFY (vía Secrets Manager), ya no se pasa como parámetro manual."
          echo "Ejecute ci_evaluador_entrega3.yml en su lugar."
          exit 1
