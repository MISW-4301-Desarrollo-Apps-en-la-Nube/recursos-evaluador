name: Entrega 2 - Destroy (reusable)

# Pipeline reutilizable: NO se dispara directamente en este repo (recursos-
# evaluador no tiene el código de terraform/k8s de ningún proyecto), solo vía
# `uses:` desde el repo de cada estudiante/tutor. Ver
# 202514-cesarf/.github/workflows/ci_entrega2_destroy.yml para un ejemplo de
# invocación. Usa el mismo config.yaml (tf_stacks / k8s_manifests) que
# ci_entrega2_deploy.yml — ver el comentario de cabecera de ese workflow
# para el contrato completo.
#
# Destruye en el orden INVERSO al que aplica el deploy: primero borra los
# manifiestos de k8s_manifests y hace terraform destroy de tf_stacks en
# orden inverso, para respetar dependencias entre stacks (ej. un stack
# "apps" que depende de un stack "network" se destruye antes que "network").
on:
  workflow_call:
    inputs:
      environment:
        description: 'Ambiente a destruir (debe existir como GitHub Environment en el repo que llama)'
        required: true
        type: string
    secrets:
      AWS_ACCESS_KEY_ID:
        required: true
      AWS_SECRET_ACCESS_KEY:
        required: true
      AWS_SESSION_TOKEN:
        required: true
      DB_USERNAME:
        required: true
      DB_PASSWORD:
        required: true

# Mismo grupo (sin prefijo "deploy-"/"destroy-") que ci_entrega2_deploy.yml a
# propósito: un deploy y un destroy del mismo ambiente nunca deben correr en
# paralelo.
concurrency:
  group: infra-${{ github.ref }}-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  # -----------------------------------------------------------------------
  # 0. Valida secrets requeridos y lee de config.yaml / los .tfvars de cada
  #    stack la misma configuración que ci_entrega2_deploy.yml (tf_stacks,
  #    k8s_manifests, región, nombre del cluster), para que ambos pipelines
  #    apunten siempre al mismo lugar.
  # -----------------------------------------------------------------------
  config:
    environment: ${{ inputs.environment }}
    runs-on: ubuntu-latest
    outputs:
      tf_stacks: ${{ steps.lists.outputs.tf_stacks }}
      k8s_manifests: ${{ steps.lists.outputs.k8s_manifests }}
      region: ${{ steps.tf_config.outputs.region }}
      cluster_name: ${{ steps.tf_config.outputs.cluster_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Check required secrets are set
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          missing=()
          for var in AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN DB_USERNAME DB_PASSWORD; do
            if [ -z "${!var}" ]; then
              missing+=("$var")
            fi
          done

          if [ ${#missing[@]} -gt 0 ]; then
            echo "❌ Faltan los siguientes secrets en el repo (Settings → Secrets and variables → Actions):"
            for var in "${missing[@]}"; do
              echo "   - $var"
            done
            exit 1
          fi

          echo "✅ Todos los secrets requeridos están configurados."

      - uses: mikefarah/yq@v4.30.8

      - id: lists
        name: Leer tf_stacks / k8s_manifests de config.yaml
        run: |
          tf_stacks=$(yq -o=json -I=0 '.tf_stacks // []' config.yaml)
          k8s_manifests=$(yq -o=json -I=0 '.k8s_manifests // []' config.yaml)

          if [ "$(echo "$tf_stacks" | jq 'length')" -eq 0 ]; then
            echo "❌ config.yaml no define 'tf_stacks' (lista de carpetas de terraform a destruir)."
            exit 1
          fi
          if [ "$(echo "$k8s_manifests" | jq 'length')" -eq 0 ]; then
            echo "❌ config.yaml no define 'k8s_manifests' (lista de carpetas de manifiestos k8s a borrar)."
            exit 1
          fi

          echo "tf_stacks=${tf_stacks}" >> "$GITHUB_OUTPUT"
          echo "k8s_manifests=${k8s_manifests}" >> "$GITHUB_OUTPUT"

      - id: tf_config
        name: Descubrir región / cluster para los stacks
        run: |
          region=""
          cluster_name=""

          for stack in $(echo '${{ steps.lists.outputs.tf_stacks }}' | jq -r '.[]'); do
            env_dir="terraform/environments/${{ inputs.environment }}/$(basename "$stack")"
            backend_file="${env_dir}/backend.tfvars"
            tfvars_file="${env_dir}/terraform.tfvars"

            if [ ! -f "$backend_file" ]; then
              echo "❌ No existe ${backend_file} (esperado para el stack '${stack}')."
              exit 1
            fi

            stack_region=$(grep '^region' "$backend_file" | cut -d'"' -f2)
            region="${region:-$stack_region}"

            if [ -z "$cluster_name" ] && [ -f "$tfvars_file" ]; then
              found=$(grep '^cluster_name' "$tfvars_file" | cut -d'"' -f2 || true)
              cluster_name="${cluster_name:-$found}"
            fi
          done

          if [ -z "$cluster_name" ]; then
            echo "❌ Ningún stack de tf_stacks define 'cluster_name' en su terraform.tfvars (se usa para conectar kubectl en teardown-k8s)."
            exit 1
          fi

          echo "region=${region}" >> "$GITHUB_OUTPUT"
          echo "cluster_name=${cluster_name}" >> "$GITHUB_OUTPUT"

  # -----------------------------------------------------------------------
  # 1. Desinstala ingress-nginx y borra los manifiestos de k8s_manifests
  #    ANTES de tocar Terraform. El Service tipo LoadBalancer crea un
  #    Elastic Load Balancer real en AWS que Terraform nunca gestionó (lo
  #    creó el cloud-controller-manager de EKS vía Helm). Si se destruye el
  #    cluster/VPC con ese ELB todavía vivo, puede quedar huérfano
  #    (facturando) o bloquear el borrado de subnets/security groups porque
  #    el ELB todavía tiene ENIs conectadas ahí. Por eso hay que esperar a
  #    que el ELB real desaparezca de AWS, no solo a que se borre el objeto
  #    Service de k8s.
  # -----------------------------------------------------------------------
  teardown-k8s:
    environment: ${{ inputs.environment }}
    needs: config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ needs.config.outputs.region }}

      # Hace que este job (y por lo tanto el pipeline completo) sea seguro
      # de re-ejecutar: si el cluster ya no existe (ej. un destroy previo
      # falló después de este paso), no falla acá, solo lo informa y sigue.
      - name: Check if EKS cluster exists
        id: cluster_check
        run: |
          if aws eks describe-cluster --name "${{ needs.config.outputs.cluster_name }}" --region "${{ needs.config.outputs.region }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "ℹ️ El cluster ${{ needs.config.outputs.cluster_name }} no existe (o ya fue borrado). Se omite la limpieza de k8s."
          fi

      - name: Update kubeconfig
        if: steps.cluster_check.outputs.exists == 'true'
        run: |
          aws eks update-kubeconfig \
            --region "${{ needs.config.outputs.region }}" \
            --name "${{ needs.config.outputs.cluster_name }}"

      - uses: azure/setup-helm@v4
        if: steps.cluster_check.outputs.exists == 'true'

      - name: Uninstall ingress-nginx
        if: steps.cluster_check.outputs.exists == 'true'
        run: |
          if helm status ingress-nginx -n ingress-nginx >/dev/null 2>&1; then
            helm uninstall ingress-nginx -n ingress-nginx --wait --timeout 5m
          else
            echo "ℹ️ El release ingress-nginx no existe, no hay nada que desinstalar."
          fi

      - name: Wait for the AWS load balancer to be fully deleted
        if: steps.cluster_check.outputs.exists == 'true'
        run: |
          echo "Esperando a que AWS termine de eliminar el load balancer de ingress-nginx..."
          for i in $(seq 1 30); do
            remaining=$(aws resourcegroupstaggingapi get-resources \
              --resource-type-filters elasticloadbalancing \
              --tag-filters Key=kubernetes.io/service-name,Values=ingress-nginx/ingress-nginx-controller \
              --query 'length(ResourceTagMappingList)' --output text)
            if [ "${remaining}" = "0" ]; then
              echo "✅ Load balancer eliminado."
              exit 0
            fi
            echo "   Todavía existe (intento ${i}/30), esperando 20s..."
            sleep 20
          done
          echo "❌ El load balancer de ingress-nginx sigue existiendo después de ~10 min. Revisa la consola de AWS (EC2 → Load Balancers) antes de seguir con terraform destroy."
          exit 1

      # Prolijidad: borra el resto de los manifiestos de k8s_manifests, en
      # orden inverso al del deploy. No es estrictamente necesario (destruir
      # el cluster se los lleva a todos), pero deja el ambiente limpio si el
      # destroy de Terraform se corre más tarde o falla a mitad de camino.
      - name: Delete remaining k8s manifests
        if: steps.cluster_check.outputs.exists == 'true'
        run: |
          echo '${{ needs.config.outputs.k8s_manifests }}' | jq -r 'reverse | .[]' | while read -r dir; do
            echo "::group::kubectl delete ($dir)"
            kubectl delete -f "$dir" --ignore-not-found
            echo "::endgroup::"
          done

  # -----------------------------------------------------------------------
  # 2. terraform destroy de cada stack en tf_stacks, en orden INVERSO al del
  #    deploy (se lleva EKS, RDS, Secrets Manager, repos ECR, etc., según lo
  #    que gestione cada stack).
  # -----------------------------------------------------------------------
  terraform-destroy:
    environment: ${{ inputs.environment }}
    needs: [config, teardown-k8s]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ needs.config.outputs.region }}

      - name: Read required Terraform version
        id: tf_version
        run: echo "version=$(cat terraform/.terraform-version)" >> "$GITHUB_OUTPUT"

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ steps.tf_version.outputs.version }}

      - name: Destroy each terraform stack, in reverse order
        env:
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          echo '${{ needs.config.outputs.tf_stacks }}' | jq -r 'reverse | .[]' | while read -r stack; do
            env_dir="terraform/environments/${{ inputs.environment }}/$(basename "$stack")"
            # "../" repetido tantas veces como partes tenga $stack, para
            # llegar desde el stack hasta la raíz del repo y de ahí a
            # $env_dir (terraform init/destroy corren con working-directory
            # dentro del propio stack).
            depth=$(echo "$stack" | awk -F'/' '{print NF}')
            prefix=$(printf '../%.0s' $(seq 1 "$depth"))

            echo "::group::terraform destroy ($stack)"
            pushd "$stack" >/dev/null

            terraform init -backend-config="${prefix}${env_dir}/backend.tfvars"
            terraform destroy \
              -var="db_username=${DB_USERNAME}" \
              -var="db_password=${DB_PASSWORD}" \
              -var-file="${prefix}${env_dir}/terraform.tfvars" \
              -auto-approve

            popd >/dev/null
            echo "::endgroup::"
          done
